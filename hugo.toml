baseURL = "https://yifanbotany.com/"
title = "Yifan Wang"
languageCode = "en-us"
hasCJKLanguage = true
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[params]
  author = "Yifan Wang"
  description = "Research, publications, botanical artwork, and field photography by Yifan Wang."
  slogan = "Flowers are nature’s evolutionary playground."
  header_image = "img/home-bg-flowers.png"
  avatar = "img/yifanwang.png"
  role = "PhD student at UC Davis"
  email = "pipevine1122@gmail.com"

[[menus.main]]
  name = "Research"
  pageRef = "/research"
  weight = 10
[[menus.main]]
  name = "Publications"
  pageRef = "/publications"
  weight = 20
[[menus.main]]
  name = "CV"
  pageRef = "/cv"
  weight = 30
[[menus.main]]
  name = "News"
  pageRef = "/news"
  weight = 40
[[menus.main]]
  name = "Gallery"
  pageRef = "/gallery"
  weight = 50
[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 70

[[menus.main]]
  name = "Meet"
  pageRef = "/meet"
  weight = 60

[markup.goldmark.renderer]
  # Authored publication citations and the botanical poster legend use HTML.
  unsafe = true
[imaging]
  quality = 85
  resampleFilter = "Lanczos"
[caches.images]
  dir = ':cacheDir/images'
[[cascade]]
  [cascade.build]
    publishResources = false
