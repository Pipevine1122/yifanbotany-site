<header class="site-header">
  <div class="header-inner wrap">
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Params.author }}</a>
    <button class="menu-toggle" aria-controls="main-nav" aria-expanded="false" hidden>Menu <span aria-hidden="true">☰</span></button>
    <nav id="main-nav" aria-label="Main navigation"><ul>
      {{ range site.Menus.main }}<li><a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) (and (eq $.Type "album") (eq .Name "News")) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>{{ end }}
      <li><a href="{{ "search/" | relURL }}"{{ if eq .Section "search" }} aria-current="page"{{ end }}>Search</a></li>
    </ul></nav>
  </div>
</header>
