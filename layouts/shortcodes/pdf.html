{{ $src := .Get "src" | strings.TrimPrefix "/" | relURL }}

  <div class="link-list"><a class="button" href="{{ $src }}" download>Download CV (PDF)</a><a href="{{ $src }}" target="_blank" rel="noopener">Open PDF in a new tab</a></div>
  <object data="{{ $src }}" type="application/pdf" aria-label="Yifan Wang’s curriculum vitae"><p>Your browser cannot display this PDF. <a href="{{ $src }}">Open or download the CV</a>.</p></object>
</div>
