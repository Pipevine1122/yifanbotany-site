{{ define "main" }}
<div class="wrap page-shell narrow">
  {{ partial "page-heading.html" . }}
  {{ with .Resources.GetMatch .Params.banner }}<figure class="about-banner">{{ partial "image.html" (dict "image" . "alt" $.Params.banner_alt "width" 1600 "sizes" "(max-width: 900px) calc(100vw - 40px), 860px" "eager" true) }}</figure>{{ end }}
  <article class="prose">{{ .Content }}</article>
</div>
{{ end }}
