name: Validate and deploy Hugo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Hugo
        shell: bash
        run: |
          version="$(cat .hugo-version)"
          archive="hugo_extended_${version}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/gohugoio/hugo/releases/download/v${version}/$archive"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/checksums.txt" "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_${version}_checksums.txt"
          cd "$RUNNER_TEMP"
          grep " $archive$" checksums.txt | sha256sum --check --strict
          mkdir -p hugo-bin
          tar -xzf "$archive" -C hugo-bin hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo-cache
          key: hugo-${{ runner.os }}-${{ hashFiles('.hugo-version', 'hugo.toml', 'layouts/**', 'assets/img/**', 'content/**') }}
          restore-keys: hugo-${{ runner.os }}-
      - name: Build
        run: |
          python3 scripts/check_config.py
          hugo --gc --minify --cleanDestinationDir --panicOnWarning --cacheDir "$RUNNER_TEMP/hugo-cache"
      - name: Check generated site
        run: python3 scripts/check_site.py public
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
